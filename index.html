<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票推荐系统</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .stock-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .stock-table th, .stock-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .stock-table th { background-color: #f5f5f5; }
        .header { color: #2c3e50; }
        .strategies { color: #3498db; }
    </style>
</head>
<body>
    <h1 class="header">📈 股票推荐系统</h1>
    <p>最后更新时间：<span id="update-time">-</span></p>
    <table class="stock-table">
        <thead>
            <tr>
                <th>股票代码</th>
                <th>股票名称</th>
                <th>买入价格</th>
                <th>止盈价格</th>
                <th>止损价格</th>
                <th>命中策略</th>
            </tr>
        </thead>
        <tbody id="stock-list">
            <!-- 数据将通过JS动态填充 -->
        </tbody>
    </table>

    <!-- 引入Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

    <script>
        // 初始化Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDHd6LoUOSlDm-Nj6c8NSXdtGw5HvPi3I4",
          authDomain: "qtrader-3fd6b.firebaseapp.com",
          databaseURL: "https://qtrader-3fd6b-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "qtrader-3fd6b",
          storageBucket: "qtrader-3fd6b.firebasestorage.app",
          messagingSenderId: "746210099239",
          appId: "1:746210099239:web:6b72d2ef5e044b09a04e02",
          measurementId: "G-HECR0FG996"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 读取股票推荐数据
        function loadStockRecommendations() {
            const stockRef = db.ref('recommend');
            stockRef.on('value', (snapshot) => {
                const stocks = snapshot.val();
                const stockList = document.getElementById('stock-list');
                const updateTimeEl = document.getElementById('update-time');

                // 清空列表
                stockList.innerHTML = '';

                if (!stocks) {
                    stockList.innerHTML = '<tr><td colspan="6" style="text-align:center">暂无推荐数据</td></tr>';
                    return;
                }

                // 转换为数组并按更新时间排序
                const stockArray = Object.entries(stocks).map(([symbol, data]) => ({
                    symbol,
                    ...data
                })).sort((a, b) => b.last_updated - a.last_updated);

                // 更新最后更新时间（取第一个股票的时间）
                const lastUpdate = new Date(stockArray[0].last_updated);
                updateTimeEl.textContent = lastUpdate.toLocaleString();

                // 填充表格
                stockArray.forEach(stock => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${stock.symbol}</td>
                        <td>${stock.buy_price}</td>
                        <td>${stock.stop_gian}</td>
                        <td>${stock.stop_loss}</td>
                        <td class="strategies">${stock.strategies.join(', ')}</td>
                    `;
                    stockList.appendChild(row);
                });
            });
        }

        // 页面加载时读取数据
        window.onload = loadStockRecommendations;
    </script>
</body>
</html>
