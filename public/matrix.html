        }

        .sidebar-logo h2 {

            font-size: 1.5em;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;

        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #a8dadc;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(109, 213, 250, 0.1);
            color: #6dd5fa;
        }

        .nav-item svg {
            margin-right: 10px;
        }

        .nav-item span {
            font-size: 0.9em;
        }

        }

        }

            border: 1px solid rgba(109, 213, 250, 0.2);

            text-align: left;
            font-size: 1.05em;

            background-color: rgba(0,0,0,0.5);

        /* 分页按钮样式 */

            color: #6dd5fa;

        .pagination-btn:disabled {

            border: 1px solid rgba(109, 213, 250, 0.4);
            border-radius: 4px;

            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            border-color: #60a5fa;

        .pagination-btn-modern:disabled {

        /* 分页下拉框样式 */

            border-color: #6dd5fa;
        }
        
        #page-size option {
            background: #0f172a;
            color: #e2e8f0;
        }

    <script type="module">
        // 导入Firebase模块
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getDatabase, ref, onValue, orderByKey, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";
        import {
            getAuth,
            signOut,
            onAuthStateChanged,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

        // Firebase配置
        const firebaseConfig = {
            apiKey: "AIzaSyDHd6LoUOSlDm-Nj6c8NSXdtGw5HvPi3I4",
            authDomain: "qtrader-3fd6b.firebaseapp.com",
            databaseURL: "https://qtrader-3fd6b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qtrader-3fd6b",
            storageBucket: "qtrader-3fd6b.firebasestorage.app",
            messagingSenderId: "746210099239",
            appId: "1:746210099239:web:6b72d2ef5e044b09a04e02",
            measurementId: "G-HECR0FG996"
        };

        // 初始化Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // 退出登录
        window.logout = async () => {
            try {
                // 清理所有数据内容
                document.getElementById('stock-list').innerHTML = '<tr><td colspan="6" style="text-align:center" class="loading">加载中...</td></tr>';
                document.getElementById('history-list').innerHTML = '<tr><td colspan="6" style="text-align:center" class="loading">加载中...</td></tr>';
                document.getElementById('update-time').textContent = '-';
                
                // 重置分页相关状态
                window.historyStocks = [];
                window.currentPage = 1;
                window.pageSize = 10;
                window.sortField = null;
                window.sortDirection = 'asc';
                
                // 清空搜索和筛选条件
                document.getElementById('history-search').value = '';
                document.getElementById('history-filter').value = '';
                
                // 重置分页控件
                document.getElementById('page-info').textContent = '';
                document.getElementById('first-page').disabled = false;
                document.getElementById('prev-page').disabled = false;
                document.getElementById('next-page').disabled = false;
                document.getElementById('last-page').disabled = false;
                
                // 确保显示每日推荐tab
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.tab-btn[data-tab="daily"]').classList.add('active');
                
                // 隐藏历史推荐内容
                document.getElementById('history-data').style.display = 'none';
                
                await signOut(auth);
                window.location.href = 'index.html';
            } catch (error) {
                console.error("退出登录失败:", error);
            }
        };

        // 监听认证状态变化
        onAuthStateChanged(auth, (user) => {
            const userInfo = document.getElementById('user-info');
            const userEmail = document.getElementById('user-email');
            
            if (user) {
                userEmail.textContent = user.email;
                userInfo.classList.add('visible');
                loadStockRecommendations();
            } else {
                // 未登录重定向到登录页
                window.location.href = 'index.html';
            }
        });

        // 导航栏项目点击事件
        document.querySelectorAll('.nav-item[data-target]').forEach(item => {
            item.addEventListener('click', () => {
                const target = item.getAttribute('data-target');
                let url;
                
                switch(target) {
                    case 'simulating':
                        url = 'simulating.html';
                        break;
                    case 'matrix':
                        url = 'matrix.html';
                        break;
                    case 'asterism':
                        url = 'asterism.html';
                        break;
                    case 'user':
                        url = 'user.html';
                        break;
                    default:
                        return;
                }
                
                // 更新导航栏激活状态
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                // 跳转到对应页面
                window.location.href = url;
            });
        });

        // Tab切换功能
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // 切换Tab按钮状态
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const tabType = btn.getAttribute('data-tab');
                const stockTable = document.getElementById('stock-list').closest('table').parentElement;
                const historyData = document.getElementById('history-data');
                const updateTime = document.querySelector('#stock-container > p'); // 获取更新时间元素

                // 显示对应的内容区域
                if (tabType === 'daily') {
                    document.getElementById('stock-list').closest('table').style.display = 'table';
                    historyData.style.display = 'none';
                    if (updateTime) updateTime.style.display = 'block'; // 显示更新时间
                } else {
                    document.getElementById('stock-list').closest('table').style.display = 'none';
                    historyData.style.display = 'block';
                    if (updateTime) updateTime.style.display = 'none'; // 隐藏更新时间
                    loadHistoryData(); // 加载历史数据
                }
                            
                // 确保滚动条位置正确
                window.scrollTo(0, 0);
            });
        });

        // 加载历史数据
        function loadHistoryData() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '<tr><td colspan="6" style="text-align:center" class="loading">加载中...</td></tr>';

            const stockRef = ref(db, 'recommend');

            // 查询所有历史数据
            onValue(stockRef, (snapshot) => {
                historyList.innerHTML = '';

                if (!snapshot.exists()) {
                    historyList.innerHTML = '<tr><td colspan="6" style="text-align:center">暂无历史数据</td></tr>';
                    return;
                }

                const allData = snapshot.val();
                const dates = Object.keys(allData).sort(); // 按日期排序
                
                // 排除最新日期的数据，只显示历史数据
                if (dates.length <= 1) {
                    historyList.innerHTML = '<tr><td colspan="6" style="text-align:center">暂无历史数据</td></tr>';
                    return;
                }
                
                // 移除最新日期
                dates.pop();
                
                let allStocks = [];

                // 收集除最新日期外的所有股票数据
                dates.forEach(date => {
                    const dateData = allData[date];
                    if (dateData.data && dateData.data.length) {
                        dateData.data.forEach(stock => {
                            allStocks.push({...stock, date});
                        });
                    }
                });

                // 按日期倒序排序
                allStocks.sort((a, b) => new Date(b.date) - new Date(a.date));

                // 填充表格
                if (allStocks.length === 0) {
                    historyList.innerHTML = '<tr><td colspan="6" style="text-align:center">暂无历史数据</td></tr>';
                    return;
                }

                // 初始化分页和排序参数
                window.historyStocks = allStocks;
                window.currentPage = 1;
                window.pageSize = 10;
                window.sortField = null;
                window.sortDirection = 'asc';

                // 绑定事件
                bindHistoryEvents();

                // 显示第一页数据
                displayHistoryPage();
            }, (error) => {
                console.error("读取历史数据失败：", error.message);
                historyList.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#e74c3c">历史数据加载失败</td></tr>`;
            });
        }

        // 绑定历史数据事件
        function bindHistoryEvents() {
            // 搜索事件
            const searchInput = document.getElementById('history-search');
            searchInput.addEventListener('input', function() {
                window.currentPage = 1;
                displayHistoryPage();
            });

            // 筛选事件
            const filterSelect = document.getElementById('history-filter');
            filterSelect.addEventListener('change', function() {
                window.currentPage = 1;
                displayHistoryPage();
            });

            // 分页大小事件
            const pageSizeSelect = document.getElementById('page-size');
                    
            pageSizeSelect.addEventListener('change', function() {
                const pageSize = parseInt(this.value);
                window.pageSize = pageSize;
                window.currentPage = 1;
                displayHistoryPage();
            });

            // 排序事件
            document.querySelectorAll('#history-table th[data-sort]').forEach(th => {
                th.addEventListener('click', function() {
                    const field = this.getAttribute('data-sort');
                    if (window.sortField === field) {
                        window.sortDirection = window.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        window.sortField = field;
                        window.sortDirection = 'asc';
                    }
                    
                    // 更新表头显示
                    document.querySelectorAll('#history-table th[data-sort]').forEach(header => {
                        if (header === this) {
                            header.textContent = header.textContent.replace(/ [↑↓]$/, '') + (window.sortDirection === 'asc' ? ' ↑' : ' ↓');
                        } else {
                            header.textContent = header.textContent.replace(/ [↑↓]$/, '');
                        }
                    });
                    
                    window.currentPage = 1;
                    displayHistoryPage();
                });
            });

            // 分页按钮事件
            document.getElementById('first-page').addEventListener('click', function() {
                window.currentPage = 1;
                displayHistoryPage();
            });

            document.getElementById('prev-page').addEventListener('click', function() {
                if (window.currentPage > 1) {
                    window.currentPage--;
                    displayHistoryPage();
                }
            });

            document.getElementById('next-page').addEventListener('click', function() {
                const totalPages = Math.ceil(getFilteredStocks().length / window.pageSize);
                if (window.currentPage < totalPages) {
                    window.currentPage++;
                    displayHistoryPage();
                }
            });

            document.getElementById('last-page').addEventListener('click', function() {
                const totalPages = Math.ceil(getFilteredStocks().length / window.pageSize);
                window.currentPage = totalPages;
                displayHistoryPage();
            });
        }

        // 获取筛选后的数据
        function getFilteredStocks() {
            const searchInput = document.getElementById('history-search');
            const filterSelect = document.getElementById('history-filter');
            
            const searchTerm = searchInput.value.toLowerCase();
            const filterValue = filterSelect.value;

            return window.historyStocks.filter(stock => {
                // 股票代码筛选
                const matchesSearch = stock.symbol.toLowerCase().includes(searchTerm);

                // 策略筛选
                const matchesFilter = !filterValue || 
                    (stock.strategies && stock.strategies.includes(filterValue));

                return matchesSearch && matchesFilter;
            });
        }

        // 显示历史数据页面
        function displayHistoryPage() {
            const historyList = document.getElementById('history-list');
            const filteredStocks = getFilteredStocks();
            
            // 排序
            if (window.sortField) {
                filteredStocks.sort((a, b) => {
                    let aVal = a[window.sortField];
                    let bVal = b[window.sortField];
                    
                    // 特殊处理日期字段
                    if (window.sortField === 'date') {
                        aVal = new Date(aVal);
                        bVal = new Date(bVal);
                    }
                    
                    if (aVal < bVal) {
                        return window.sortDirection === 'asc' ? -1 : 1;
                    }
                    if (aVal > bVal) {
                        return window.sortDirection === 'asc' ? 1 : -1;
                    }
                    return 0;
                });
            }

            // 分页
            const totalPages = Math.ceil(filteredStocks.length / window.pageSize);
            if (window.currentPage > totalPages && totalPages > 0) {
                window.currentPage = totalPages;
            }
            
            const startIndex = (window.currentPage - 1) * window.pageSize;
            const endIndex = startIndex + window.pageSize;
            const pageStocks = filteredStocks.slice(startIndex, endIndex);

            // 更新分页信息
            document.getElementById('page-info').textContent = 
                `${window.currentPage}/${totalPages}页 (共${filteredStocks.length}条)`;

            // 更新分页按钮状态
            document.getElementById('first-page').disabled = window.currentPage === 1;
            document.getElementById('prev-page').disabled = window.currentPage === 1;
            document.getElementById('next-page').disabled = window.currentPage === totalPages || totalPages === 0;
            document.getElementById('last-page').disabled = window.currentPage === totalPages || totalPages === 0;

            // 填充表格
            historyList.innerHTML = '';
            if (pageStocks.length === 0) {
                historyList.innerHTML = '<tr><td colspan="6" style="text-align:center">没有匹配的数据</td></tr>';
                return;
            }

            pageStocks.forEach(stock => {
                addStockToTable(stock, historyList);
            });
        }

        // 添加股票到表格
        function addStockToTable(stock, tableBody) {
            const symbol = stock.symbol || '未知代码';
            const stockDate = stock.date || '—';
            const buyPrice = stock.buy_price || '—';
            const stopGain = stock.stop_gain || '—';
            const stopLoss = stock.stop_loss || '—';
            const strategies = stock.strategies?.join(', ') || '';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${symbol}</td>
                <td>${stockDate}</td>
                <td>${buyPrice}</td>
                <td>${stopGain}</td>
                <td>${stopLoss}</td>
                <td class="strategies">${strategies}</td>
            `;
            tableBody.appendChild(row);
        }

        // 加载股票数据
        function loadStockRecommendations() {
            const stockRef = ref(db, 'recommend');
            const stockList = document.getElementById('stock-list');
            const updateTimeEl = document.getElementById('update-time');

            const latestDateQuery = query(
                stockRef,
                orderByKey(), // 按子节点名（日期）排序（YYYY-MM-DD 字典序=日期顺序）
                limitToLast(1) // 只取最后 1 条（最新日期节点）
            );

            onValue(latestDateQuery, (snapshot) => {
                stockList.innerHTML = '';

                // 1. 处理无数据情况
                if (!snapshot.exists()) {
                    stockList.innerHTML = '<tr><td colspan="6" style="text-align:center">暂无推荐数据</td></tr>';
                    updateTimeEl.textContent = '暂无更新';
                    return;
                }

                // 2. 解析最新日期节点（snapshot 只包含 1 个节点：最新日期）
                const latestDateData = snapshot.val(); // 格式：{ "2025-11-01": {data: [...], last_updated: ...} }
                const latestDate = Object.keys(latestDateData)[0]; // 提取最新日期（如 "2025-11-01"）
                const dateNode = latestDateData[latestDate]; // 最新日期节点的内容
                const latestStocks = dateNode.data || []; // 最新日期的股票数组
                const latestUpdateTime = dateNode.last_updated || Date.now(); // 最新更新时间戳

                // 3. 处理无股票数据的情况
                if (latestStocks.length === 0) {
                    stockList.innerHTML = `<tr><td colspan="6" style="text-align:center">${latestDate} 暂无推荐数据</td></tr>`;
                    updateTimeEl.textContent = new Date(latestUpdateTime).toLocaleString();
                    return;
                }

                // 4. 按股票自身更新时间排序（最新股票在前）
                latestStocks.sort((a, b) => {
                    const aTime = a.last_updated || latestUpdateTime;
                    const bTime = b.last_updated || latestUpdateTime;
                    return bTime - aTime;
                });

                // 5. 更新页面显示
                updateTimeEl.textContent = new Date(latestUpdateTime).toLocaleString();

                // 6. 填充表格
                latestStocks.forEach(stock => {
                    const symbol = stock.symbol || '未知代码';
                    const stockDate = stock.date || '—';
                    const buyPrice = stock.buy_price || '—';
                    const stopGain = stock.stop_gain || '—';
                    const stopLoss = stock.stop_loss || '—';
                    const strategies = stock.strategies?.join(', ') || '';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${symbol}</td>
                        <td>${stockDate}</td>
                        <td>${buyPrice}</td>
                        <td>${stopGain}</td>
                        <td>${stopLoss}</td>
                        <td class="strategies">${strategies}</td>
                    `;
                    stockList.appendChild(row);
                });
            }, (error) => {
                console.error("读取数据失败：", error.message);
                const errorMsg = error.code === 'PERMISSION_DENIED'
                    ? '您的账号没有访问权限'
                    : '数据加载失败，请刷新重试';
                stockList.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#e74c3c">${errorMsg}</td></tr>`;
                if (error.code === 'PERMISSION_DENIED') setTimeout(() => signOut(auth), 3000);
            });
        }
        
        // 忘记密码相关函数
        // 打开模态框
        window.openForgotPasswordModal = () => {
            document.getElementById('forgot-password-modal').style.display = 'flex';
            // 清空之前的错误/成功提示
            document.getElementById('reset-error').textContent = '';
            document.getElementById('reset-success').textContent = '';
            // 聚焦输入框
            document.getElementById('reset-email').focus();
        };

        // 关闭模态框
        window.closeForgotPasswordModal = () => {
            document.getElementById('forgot-password-modal').style.display = 'none';
        };

        // 发送重置密码邮件
        window.sendResetPasswordEmail = async () => {
            const email = document.getElementById('reset-email').value.trim();
            const errorElement = document.getElementById('reset-error');
            const successElement = document.getElementById('reset-success');

            try {
                errorElement.textContent = '';
                successElement.textContent = '';

                // 验证邮箱格式
                if (!email.includes('@')) {
                    throw new Error("请输入有效的邮箱地址");
                }

                // 调用Firebase API发送重置邮件
                await sendPasswordResetEmail(auth, email, {
                    url: window.location.origin  // 重置成功后跳转回当前页面（可选）
                });

                // 提示成功
                successElement.textContent = "重置邮件已发送！请查收邮箱（含垃圾邮件）";
                // 3秒后自动关闭模态框
                setTimeout(closeForgotPasswordModal, 3000);
            } catch (error) {
                // 处理不同错误类型
                let errorMsg;
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMsg = "该邮箱未注册，请输入授权邮箱";
                        break;
                    case 'auth/invalid-email':
                        errorMsg = "邮箱格式无效，请重新输入";
                        break;
                    default:
                        errorMsg = `发送失败: ${error.message}`;
                }
                errorElement.textContent = errorMsg;
            }
        };

        // 点击模态框外部关闭
        window.onclick = (event) => {
            const modal = document.getElementById('forgot-password-modal');
            if (event.target === modal) {
                closeForgotPasswordModal();
            }
        };
    </script>
</body>
</html>
