<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - Asterism Capital</title>
    <style>
        /* 全局样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 登录页样式 */
        .login-container {
            max-width: 500px;
            width: 90%;
            margin: 12% auto;
            padding: 30px;
            border: 1px solid rgba(109, 213, 250, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-container h2 {
            color: #6dd5fa;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #a8dadc;
        }
        input {
            width: 100%;
            padding: 12px; /* 增大输入框内边距 */
            box-sizing: border-box;
            border: 1px solid rgba(109, 213, 250, 0.3);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
            font-size: 1em; /* 增大字体 */
        }
        button {
            width: 100%;
            padding: 14px; /* 增大按钮内边距 */
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em; /* 增大按钮字体 */
            transition: background 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #2563eb, #4f97f7);
        }
        .error-message {
            color: #ef4444;
            text-align: center;
            margin: 15px 0;
        }
        .forgot-password {
            text-align: right;
            margin-top: 10px;
        }
        .forgot-password a {
            color: #6dd5fa;
            text-decoration: none;
            font-size: 0.9em;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #6dd5fa;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link a:hover {
            text-decoration: underline;
        }

        /* 模态框样式 */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.5); 
            z-index: 1000; 
            align-items: center; 
            justify-content: center; 
        }
        .modal-content { 
            background: linear-gradient(135deg, #0f172a, #1e293b);
            border: 1px solid rgba(109, 213, 250, 0.3);
            padding: 25px; 
            border-radius: 8px; 
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .modal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            border-bottom: 1px solid rgba(109, 213, 250, 0.2); 
            padding-bottom: 15px; 
        }
        .modal-title { 
            margin: 0; 
            font-size: 1.4em; 
            color: #6dd5fa; 
        }
        .close-modal { 
            background: none; 
            border: none; 
            font-size: 1.5em; 
            cursor: pointer; 
            color: #a8dadc;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-modal:hover { 
            background: rgba(255, 255, 250, 0.1);
            color: #6dd5fa;
        }
        .modal-footer { 
            margin-top: 25px; 
            text-align: right; 
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .cancel-btn { 
            background: rgba(255, 255, 255, 0.05);
            color: #a8dadc;
            border: 1px solid rgba(109, 213, 250, 0.3);
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .cancel-btn:hover { 
            background: rgba(109, 213, 250, 0.1);
            color: #6dd5fa;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #a8dadc;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid rgba(109, 213, 250, 0.3);
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
            font-size: 1em;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6dd5fa;
        }
        .error-message {
            color: #ef4444;
            margin: 10px 0;
            text-align: center;
        }
        .success-message {
            color: #34d399;
            margin: 10px 0;
            text-align: center;
        }
        .modal-footer button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }
        .modal-footer button:hover {
            background: linear-gradient(135deg, #2563eb, #4f97f7);
        }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div class="login-container">
        <h2>用户登录</h2>
        <div class="error-message" id="login-error"></div>
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" placeholder="请输入授权邮箱" required>
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <div class="forgot-password">
            <a href="javascript:openForgotPasswordModal()">忘记密码？</a>
        </div>
        <button onclick="login()">登录</button>
        <div class="back-link">
            <a href="index.html">返回首页</a>
        </div>
    </div>

    <!-- 忘记密码模态框 -->
    <div class="modal" id="forgot-password-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">重置密码</h3>
                <button class="close-modal" onclick="closeForgotPasswordModal()">×</button>
            </div>
            <div class="form-group">
                <label for="reset-email">输入您的授权邮箱</label>
                <input type="email" id="reset-email" placeholder="请输入注册时的邮箱" required>
            </div>
            <div class="error-message" id="reset-error"></div>
            <div class="success-message" id="reset-success"></div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeForgotPasswordModal()">取消</button>
                <button onclick="sendResetPasswordEmail()">发送重置邮件</button>
            </div>
        </div>
    </div>

    <script type="module">
        // 导入Firebase模块
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getDatabase, ref, onValue, orderByKey, query, limitToLast } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

        // Firebase配置
        const firebaseConfig = {
            apiKey: "AIzaSyDHd6LoUOSlDm-Nj6c8NSXdtGw5HvPi3I4",
            authDomain: "qtrader-3fd6b.firebaseapp.com",
            databaseURL: "https://qtrader-3fd6b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qtrader-3fd6b",
            storageBucket: "qtrader-3fd6b.firebasestorage.app",
            messagingSenderId: "746210099239",
            appId: "1:746210099239:web:6b72d2ef5e044b09a04e02",
            measurementId: "G-HECR0FG996"
        };

        // 初始化Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // 登录函数
        window.login = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');

            // 参数非空校验
            if (!email) {
                errorElement.textContent = "请输入邮箱";
                return;
            }
            if (!password) {
                errorElement.textContent = "请输入密码";
                return;
            }

            try {
                errorElement.textContent = '';
                await signInWithEmailAndPassword(auth, email, password);
                
                // 登录成功后检查是否有目标页面
                const urlParams = new URLSearchParams(window.location.search);
                const targetPage = urlParams.get('target');
                if (targetPage) {
                    // 如果有目标页面，则跳转到目标页面
                    window.location.href = targetPage + '.html';
                } else {
                    // 否则跳转到首页
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("登录失败详细信息：", {
                    code: error.code,
                    message: error.message
                });

                let errorMsg;
                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMsg = "邮箱格式无效，请输入正确的邮箱（如 xxx@xxx.com）";
                        break;
                    case 'auth/user-not-found':
                        errorMsg = "该邮箱未注册，请联系管理员添加账号";
                        break;
                    case 'auth/invalid-credential':
                        errorMsg = "邮箱或密码错误，请重新输入";
                        break;
                    case 'auth/operation-not-allowed':
                        errorMsg = "邮箱/密码登录功能未启用，请联系管理员";
                        break;
                    default:
                        errorMsg = `登录失败：${error.message}（错误码：${error.code}）`;
                }
                errorElement.textContent = errorMsg;
            }
        };

        // 忘记密码相关函数
        // 打开模态框
        window.openForgotPasswordModal = () => {
            document.getElementById('forgot-password-modal').style.display = 'flex';
            // 清空之前的错误/成功提示
            document.getElementById('reset-error').textContent = '';
            document.getElementById('reset-success').textContent = '';
            // 聚焦输入框
            document.getElementById('reset-email').focus();
        };

        // 关闭模态框
        window.closeForgotPasswordModal = () => {
            document.getElementById('forgot-password-modal').style.display = 'none';
        };

        // 发送重置密码邮件
        window.sendResetPasswordEmail = async () => {
            const email = document.getElementById('reset-email').value.trim();
            const errorElement = document.getElementById('reset-error');
            const successElement = document.getElementById('reset-success');

            try {
                errorElement.textContent = '';
                successElement.textContent = '';

                // 验证邮箱格式
                if (!email.includes('@')) {
                    throw new Error("请输入有效的邮箱地址");
                }

                // 调用Firebase API发送重置邮件 出于安全考虑，API不能先验证邮箱是否已注册
                await sendPasswordResetEmail(auth, email, {
                    url: window.location.origin + '/login.html'  // 重置成功后跳转回登录页面
                });

                // 提示成功
                successElement.textContent = "重置邮件已发送！请查收邮箱（含垃圾邮件）";
                // 3秒后自动关闭模态框
                setTimeout(closeForgotPasswordModal, 3000);
            } catch (error) {
                // 处理不同错误类型
                let errorMsg;
                switch (error.code) {
                    case 'auth/user-not-found':
                        errorMsg = "该邮箱未注册，请输入授权邮箱";
                        break;
                    case 'auth/invalid-email':
                        errorMsg = "邮箱格式无效，请重新输入";
                        break;
                    default:
                        errorMsg = `发送失败: ${error.message}`;
                }
                errorElement.textContent = errorMsg;
            }
        };

        // 点击模态框外部关闭
        window.onclick = (event) => {
            const modal = document.getElementById('forgot-password-modal');
            if (event.target === modal) {
                closeForgotPasswordModal();
            }
        };

    </script>
</body>
</html>
