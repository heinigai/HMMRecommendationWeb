<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票推荐系统</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; }
        .stock-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .stock-table th, .stock-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .stock-table th { background-color: #f5f5f5; }
        .header { color: #2c3e50; }
        .strategies { color: #3498db; }
    </style>
</head>
<body>
    <h1 class="header">📈 股票推荐系统</h1>
    <p>最后更新时间：<span id="update-time">-</span></p>
    <table class="stock-table">
        <thead>
            <tr>
                <th>股票代码</th>
                <th>股票名称</th>
                <th>买入价格</th>
                <th>止盈价格</th>
                <th>止损价格</th>
                <th>命中策略</th>
            </tr>
        </thead>
        <tbody id="stock-list">
            <!-- 数据将通过JS动态填充 -->
            <tr><td colspan="6" style="text-align:center">加载中...</td></tr>
        </tbody>
    </table>

    <!-- 模块化导入 Firebase SDK + 完整逻辑 -->
    <script type="module">
        // 1. 导入需要的函数（Realtime Database核心函数）
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-analytics.js";

        // 2. 你的Firebase配置（直接用官方给的，无需修改）
        const firebaseConfig = {
            apiKey: "AIzaSyDHd6LoUOSlDm-Nj6c8NSXdtGw5HvPi3I4",
            authDomain: "qtrader-3fd6b.firebaseapp.com",
            databaseURL: "https://qtrader-3fd6b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qtrader-3fd6b",
            storageBucket: "qtrader-3fd6b.firebasestorage.app",
            messagingSenderId: "746210099239",
            appId: "1:746210099239:web:6b72d2ef5e044b09a04e02",
            measurementId: "G-HECR0FG996"
        };

        // 3. 初始化Firebase（模块化写法）
        const app = initializeApp(firebaseConfig);
<!--        const analytics = getAnalytics(app); // 可选， analytics 功能-->
        const db = getDatabase(app); // 初始化Realtime Database实例（关键！替换旧版的firebase.database()）

        // 4. 验证SDK加载成功（控制台打印，可删除）
        console.log("Firebase初始化成功！");
        console.log("数据库实例：", db);

        // 5. 读取股票数据（模块化写法，替换旧版逻辑）
        function loadStockRecommendations() {
            // 指向 Realtime Database 中的 stock_recommendations 节点
            const stockRef = ref(db, 'recommend');

            // 监听数据变化（实时更新）
            onValue(stockRef, (snapshot) => {
                const stocks = snapshot.val();
                const stockList = document.getElementById('stock-list');
                const updateTimeEl = document.getElementById('update-time');

                stockList.innerHTML = ''; // 清空列表

                if (!stocks) {
                    stockList.innerHTML = '<tr><td colspan="6" style="text-align:center">暂无推荐数据</td></tr>';
                    return;
                }

                // 转换为数组并按更新时间排序
                const stockArray = Object.entries(stocks).map(([symbol, data]) => ({
                    symbol,
                    ...data
                })).sort((a, b) => b.last_updated - a.last_updated);

                // 更新最后更新时间
                const lastUpdate = new Date(stockArray[0].last_updated);
                updateTimeEl.textContent = lastUpdate.toLocaleString();

                // 填充表格
                stockArray.forEach(stock => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${stock.symbol}</td>
                        <td>${stock.buy_price}</td>
                        <td>${stock.stop_gain}</td>
                        <td>${stock.stop_loss}</td>
                        <td class="strategies">${stock.strategies.join(', ')}</td>
                    `;
                    stockList.appendChild(row);
                });
            }, (error) => {
                console.error("读取数据失败：", error.message);
                stockList.innerHTML = '<tr><td colspan="5" style="text-align:center">数据加载失败，请刷新重试</td></tr>';
            });
        }

        // 页面加载时执行
        loadStockRecommendations();
    </script>
</body>
</html>
